name: 每小时抓取峰哥微博

on:
  schedule:
    # 每小时第 17 分运行（UTC 时间，GitHub Actions 使用 UTC）
    - cron: "17 * * * *"
  workflow_dispatch:  # 允许在 Actions 页面手动触发一次

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行爬虫（纯标准库，无需安装依赖）
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python weibo_crawler.py

      - name: 提交新增存档
        run: |
          git config user.name "weibo-archiver"
          git config user.email "weibo-archiver@users.noreply.github.com"
          git add weibo_posts.jsonl archive.md
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "存档更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
